services:
  admin:
    build:
      context: .
      dockerfile: deploy/admin.Containerfile
    image: ghcr.io/willwagner/jobs.willwagner.me:${VERSION:-local}
    environment:
      JOBS_ADMIN_ADDR: ":8081"
      JOBS_DB_PATH: /data/jobs.sqlite3
      JOBS_ADMIN_TOKEN: ${JOBS_ADMIN_TOKEN:?set JOBS_ADMIN_TOKEN}
      JOBS_SMTP_ADDR: ${JOBS_SMTP_ADDR:-}
      JOBS_SMTP_USERNAME: ${JOBS_SMTP_USERNAME:-}
      JOBS_SMTP_PASSWORD: ${JOBS_SMTP_PASSWORD:-}
      JOBS_SMTP_FROM: job-search@willwagner.me
    ports:
      - "8081:8081"
    volumes:
      - jobs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Containerfile
    image: ghcr.io/willwagner/jobs.willwagner.me-web:${VERSION:-local}
    environment:
      JOBS_DB: /data/jobs.sqlite3
      WEB_ADDR: ":8080"
      JOBS_SMTP_ADDR: ${JOBS_SMTP_ADDR:?set JOBS_SMTP_ADDR}
      JOBS_SMTP_USERNAME: ${JOBS_SMTP_USERNAME:?set JOBS_SMTP_USERNAME}
      JOBS_SMTP_PASSWORD: ${JOBS_SMTP_PASSWORD:?set JOBS_SMTP_PASSWORD}
      JOBS_SMTP_FROM: job-search@willwagner.me
    ports:
      - "8080:8080"
    volumes:
      - jobs-data:/data
    restart: unless-stopped

volumes:
  jobs-data:
