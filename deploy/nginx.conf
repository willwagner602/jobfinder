server {
    listen 80;
    server_name jobs.willwagner.me;

    location /healthz {
        proxy_pass http://admin:8081/healthz;
    }

    location /admin/ {
        proxy_pass http://admin:8081/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /admin {
        proxy_pass http://admin:8081/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
